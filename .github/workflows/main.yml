          name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip wget curl autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev gettext libltdl-dev

      - name: Install Buildozer
        run: |
          python3 -m pip install --user --upgrade pip setuptools wheel
          python3 -m pip install --user buildozer==1.5.0 cython==0.29.36
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          MODERN="$SDK/cmdline-tools/latest"
          LEGACY="$SDK/tools"
          rm -rf "$SDK"
          mkdir -p "$MODERN"
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O android-tools.zip
          unzip -q android-tools.zip
          cp -r cmdline-tools/* "$MODERN/"
          mkdir -p "$LEGACY"
          cp -r "$MODERN"/. "$LEGACY/"
          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$MODERN/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$LEGACY/bin/sdkmanager"
          test -f "$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses
          "$SDKMANAGER" --sdk_root="$SDK" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          test -f "$SDK/build-tools/35.0.0/aapt"
          test -f "$SDK/build-tools/35.0.0/aidl"
          echo "SUCCESS: Android SDK installed."

      - name: Diagnostics
        shell: bash
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          java -version
          python3 --version
          buildozer --version
          "$SDK/tools/bin/sdkmanager" --version
          ls "$SDK/build-tools" || true
          ls "$SDK/platforms" || true

      - name: Build APK
        shell: bash
        run: |
          set -e
          export ANDROIDSDK="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_HOME="$ANDROIDSDK"
          export PATH="$HOME/.local/bin:$ANDROIDSDK/cmdline-tools/latest/bin:$ANDROIDSDK/platform-tools:$PATH"
          buildozer android debug

      - name: Verify APK
        shell: bash
        run: |
          find bin -type f -name "*.apk" -print
          if ! find bin -type f -name "*.apk" | grep -q .; then
            echo "FAILED: APK was not created."
            exit 1
          fi
          echo "SUCCESS: APK created."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyMusic-APK
          path: bin/*.apk
          if-no-files-found: error
